name: Build Windows Window Read Test

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build EXE
        run: pyinstaller --onefile --windowed --name PokerAI_Window_Read_Test app.py

      - uses: actions/upload-artifact@v4
        with:
          name: PokerAI_Window_Read_Test
          path: dist/PokerAI_Window_Read_Test.exe
